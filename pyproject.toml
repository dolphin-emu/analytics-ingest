[project]
name = "analytics-ingest"
version = "0.1.0"
description = "Dolphin's Analytics data ingestion server"
authors = [{ name = "Pierre Bourdon", email = "delroth@dolphin-emu.org" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "bottle>=0.13.4,<0.14",
    "clickhouse-driver>=0.2.11,<0.3",
    "prometheus-client>=0.26.0,<0.27",
    "gunicorn>=26.1.0,<27",
]

[project.scripts]
analytics-ingest = "analytics_ingest.__main__:main"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "pytest>=9.1.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics_ingest"]
